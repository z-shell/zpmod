version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
lint:
  # Don't skip clang tools just because compile_commands.json is missing;
  # this ensures the linter's prepare_command runs to generate it first.
  skip_missing_compile_command: false
  # Where Trunk should look for compile commands once generated.
  compile_commands_roots:
    - build-cmake
    - .
  disabled:
    - checkov
    - trufflehog
    # IWYU conflicts with our gateway include pattern (zpmod.mdh/pro)
    - include-what-you-use
  enabled:
    - pinact@4.1.1
    - pragma-once
    - hadolint@2.15.1
    - clang-tidy@16.0.3
    - clang-format@20.1.0
    - gitleaks@8.30.1
    - prettier@3.9.6
    - actionlint@1.7.12
    - markdownlint@0.49.1
    - yamllint@1.38.0
    - git-diff-check
    - shfmt@3.13.1
    - shellcheck@0.11.0
  # Ensure compile_commands.json exists before clang-tidy runs by adding a
  # lightweight prepare step to its lint command. This keeps generation inside
  # trunk runs (CLI/CI/IDE) instead of relying only on git hooks.
  definitions:
    - name: git-diff-check
      # Trunk stages targets in a temporary directory. zpmod is a submodule
      # whose checked-out `.git` file has a path relative to its real root, so
      # running plain `git diff --check` from that staging directory cannot
      # resolve the gitdir. Anchor the command at the actual workspace instead.
      commands:
        - name: lint
          output: regex
          parse_regex: "((?P<path>.*):(?P<line>-?\\d+):(?P<message>.*))"
          success_codes: [0, 1, 2]
          run: git -C "${workspace}" diff --check ${target}
          read_output_from: stdout
          batch: true
      environment:
        - name: PATH
          list: ["${env.PATH}"]
    - name: clang-tidy
      # Ensure compile_commands.json is generated before Trunk scans it.
      prepare_command:
        - /bin/sh
        - -lc
        - /bin/sh ./scripts/gen-compile-commands.sh
      # Keep the root config in Trunk's cache key. clang-tidy discovers the
      # root `.clang-tidy` while the plugin retains its fixes-file protocol.
      direct_configs:
        - .clang-tidy
      # Leave the plugin's command intact. Its `--export-fixes=${tmpfile}` and
      # `read_output_from: tmp_file` are the protocol Trunk uses to parse
      # clang-tidy results. Replacing it with stdout diagnostics makes Trunk
      # parse text such as `file.c:line:column` as a fixes YAML document.
      environment:
        # Ensure clang-tidy runs with both its tool bin and the existing PATH so cmake is resolvable
        - name: PATH
          list: ["${path}", "${linter}/bin"]
    - name: clang-format
      # Ensure compile_commands.json is generated on trunk check even if
      # clang-tidy is skipped; clang-format doesn't require the DB but we
      # piggyback its prepare step to keep the DB fresh.
      prepare_command:
        - /bin/sh
        - -lc
        - /bin/sh ./scripts/gen-compile-commands.sh
      # Force clang-format to use the pinned config under .trunk/configs
      direct_configs:
        - .trunk/configs/.clang-format
      commands:
        - name: format
          output: rewrite
          # `-style=file` searches upward from the *source file* for a
          # `.clang-format`, and `-assume-filename` only names the file being
          # formatted; it does not select a config. Because no `.clang-format`
          # exists at the repo root, the old invocation silently fell back to
          # built-in LLVM defaults (80-column, 2-space) and the pinned config
          # under .trunk/configs was never applied. `--style=file:<path>` loads
          # that exact file.
          run: clang-format -i "--style=file:${workspace}/.trunk/configs/.clang-format" "${target}"
          formatter: true
          in_place: true
          success_codes: [0]
          run_from: workspace
    - name: shfmt
      # Git's configured whitespace policy rejects tab-indented additions in
      # this repository. Pin two-space indentation rather than shfmt's default
      # tabs, and keep it aligned with .editorconfig.
      commands:
        - name: format
          output: shfmt
          run: shfmt -w -s -i 2 ${target}
          success_codes: [0, 1]
          cache_results: true
          formatter: true
          batch: true
          in_place: true
  ignore:
    # Exclude vendor and build outputs across all linters
    - linters: [ALL]
      paths:
        - "vendor/**"
        - "build/**"
        - "build-cmake/**"
        - "**/CMakeFiles/**"
        - "**/generated/**"
        - "**/out/**"
        - "**/stage/**"
        - ".trunk/out/**"
        - "compile_commands.json"
    # Avoid running shellcheck & shfmt on zsh/ztst files (not supported and risky)
    - linters: [shellcheck, shfmt]
      paths:
        - "**/*.zsh"
        - "**/*.ztst"
    # Keep clang-format/clang-tidy on our C sources/headers and exclude
    # unrelated directories.
    - linters: [clang-tidy, clang-format]
      paths:
        - ".github/**"
        - "docs/**"
        - "tests/**"
        - "scripts/**"
        - "docker/**"
        - "cmake/**"
        - "src/completion/**"
runtimes:
  enabled:
    - python@3.14.4
    # gitleaks 8.30.1 requires go >= 1.24.11. A lower pin makes the hermetic
    # `go install` fall back to downloading a newer toolchain, which is slow and
    # frequently fails, leaving an empty tool dir and "Unable to find binary in
    # PATH: gitleaks" on every subsequent run.
    - go@1.25.13
    - node@24.8.0
actions:
  enabled:
    - trunk-check-pre-push
    - trunk-announce
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
