version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.2
      uri: https://github.com/trunk-io/plugins
lint:
  # Avoid failing the first pass if compile_commands.json isn't present yet; our
  # linter-level prepare_command will generate it before clang-tidy actually runs.
  skip_missing_compile_command: true
  # Where Trunk should look for compile commands once generated.
  compile_commands_roots:
    - build-cmake
    - .
  disabled:
    - checkov
    - trufflehog
    - include-what-you-use
  enabled:
    - pragma-once
    - hadolint@2.13.1
    - clang-tidy@16.0.3
    - clang-format@16.0.3
    - gitleaks@8.28.0
    - prettier@3.6.2
    - actionlint@1.7.7
    - markdownlint@0.45.0
    - yamllint@1.37.1
    - git-diff-check
    - shfmt@3.6.0
    - shellcheck@0.11.0
  # Ensure compile_commands.json exists before clang-tidy runs by adding a
  # lightweight prepare step to its lint command. This keeps generation inside
  # trunk runs (CLI/CI/IDE) instead of relying only on git hooks.
  definitions:
    - name: clang-tidy
      # Ensure compile_commands.json is generated before Trunk scans it.
      prepare_command:
        - /bin/sh
        - -lc
        - /bin/sh ./scripts/gen-compile-commands.sh
      # Force clang-tidy to read our pinned config
      direct_configs:
        - .trunk/configs/.clang-tidy
      commands:
        - name: lint
          output: llvm
          run: clang-tidy --export-fixes=${tmpfile} --config-file=./.trunk/configs/.clang-tidy ${target} -p ${compile_commands_dir}
          success_codes: [0, 1]
          read_output_from: tmp_file
          run_from: workspace
          run_when: [cli, monitor, ci]
          max_concurrency: 4
      environment:
        # Ensure clang-tidy runs with both its tool bin and the existing PATH so cmake is resolvable
        - name: PATH
          list: ["${path}", "${linter}/bin"]
    - name: clang-format
      # Force clang-format to use the pinned config under .trunk/configs
      direct_configs:
        - .trunk/configs/.clang-format
      commands:
        - name: format
          output: rewrite
          run: clang-format -i -style=file -assume-filename=./.trunk/configs/.clang-format "${target}"
          formatter: true
          in_place: true
          success_codes: [0]
          run_from: workspace
  ignore:
    # Exclude vendor and build outputs across all linters
    - linters: [ALL]
      paths:
        - "vendor/**"
        - "build/**"
        - "build-cmake/**"
        - "**/CMakeFiles/**"
        - "**/generated/**"
        - "**/out/**"
        - "**/stage/**"
        - ".trunk/out/**"
    # Avoid running shellcheck & shfmt on zsh/ztst files (not supported and risky)
    - linters: [shellcheck, shfmt]
      paths:
        - "**/*.zsh"
        - "**/*.ztst"
runtimes:
  enabled:
    - python@3.10.8
    - go@1.21.0
    - node@22.16.0
actions:
  enabled:
    - trunk-announce
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
