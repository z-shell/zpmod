version: 0.1
cli:
  version: 1.24.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.1
      uri: https://github.com/trunk-io/plugins
lint:
  disabled:
    - yamllint
    - checkov
    - trufflehog
  enabled:
    - gitleaks@8.27.2
    - prettier@3.6.2
    - actionlint@1.7.7
    - markdownlint@0.45.0
    - git-diff-check
    - shfmt@3.6.0
    - shellcheck@0.10.0
    - zpmod-maintenance
    - zpmod-quality # New comprehensive quality checks
  definitions:
    # Comprehensive zpmod workspace maintenance
    - name: zpmod-maintenance
      files: [ALL]
      commands:
        - name: health-check
          run: ${workspace}/Scripts/maintenance.sh check-health
          output: pass_fail
          success_codes: [0, 1]
          read_output_from: stdout
        - name: version-check
          run: ${workspace}/Scripts/maintenance.sh check-versions
          output: pass_fail
          success_codes: [0, 1]
          read_output_from: stdout
        - name: security-scan
          run: ${workspace}/Scripts/maintenance.sh security-scan
          output: pass_fail
          success_codes: [0, 1]
          read_output_from: stdout
        - name: clean
          run: ${workspace}/Scripts/maintenance.sh clean-deep
          output: pass_fail
          success_codes: [0, 1]
          read_output_from: stdout
      batch: false

    # New: Comprehensive quality checks (replaces GitHub Actions)
    - name: zpmod-quality
      files: [ALL]
      commands:
        - name: todo-check
          run: ${workspace}/Scripts/quality-todo-check.sh
          output: pass_fail
          success_codes: [0, 1]
          read_output_from: stdout

        - name: build-consistency
          run: ${workspace}/Scripts/quality-build-check.sh
          output: pass_fail
          success_codes: [0, 1]
          read_output_from: stdout

        - name: docs-structure
          run: ${workspace}/Scripts/quality-docs-structure.sh
          output: pass_fail
          success_codes: [0, 1]
          read_output_from: stdout

        - name: docs-links
          run: ${workspace}/Scripts/quality-docs-links.sh
          output: pass_fail
          success_codes: [0, 1]
          read_output_from: stdout
      batch: false
  ignore:
    - linters: [ALL]
      paths:
        - "Src/*"
        - "Test/*"
        - "Config/*"
        - "config*"
        - "configure*"
        - "install-sh"
        - "mkinstalldirs"
    # Don't run maintenance checks on specific paths
    - linters: [zpmod-maintenance]
      paths:
        - ".trunk/*"
        - ".git/*"
        - "*.tmp"
        - "*.backup"
runtimes:
  enabled:
    - python@3.10.8
    - go@1.21.0
    - node@22.16.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
