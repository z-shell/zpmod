version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.7.2
      uri: https://github.com/trunk-io/plugins
lint:
  disabled:
    - checkov
    - trufflehog
    - include-what-you-use
  enabled:
    - pragma-once
    - hadolint@2.12.1-beta
    - clang-tidy@16.0.3
    - clang-format@16.0.3
    - gitleaks@8.28.0
    - prettier@3.6.2
    - actionlint@1.7.7
    - markdownlint@0.45.0
    - yamllint@1.37.1
    - git-diff-check
    - shfmt@3.6.0
    - shellcheck@0.11.0
  ignore:
    # Exclude vendor and build outputs across all linters
    - linters: [ALL]
      paths:
        - "vendor/**"
        - "build/**"
        - "build-cmake/**"
        - "**/CMakeFiles/**"
        - "**/generated/**"
        - "**/out/**"
        - "**/stage/**"
        - ".trunk/out/**"
    # Avoid running shellcheck & shfmt on zsh/ztst files (not supported and risky)
    - linters: [shellcheck, shfmt]
      paths:
        - "**/*.zsh"
        - "**/*.ztst"
runtimes:
  enabled:
    - python@3.10.8
    - go@1.21.0
    - node@22.16.0
actions:
  enabled:
    - trunk-announce
    # Ensure compile_commands.json is (re)generated before formatting/checks
    - zpm-gen-compile-commands-pre-commit
    - zpm-gen-compile-commands-pre-push
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
  # Custom actions to regenerate compile_commands.json before trunk hooks
  definitions:
    - id: zpm-gen-compile-commands-pre-commit
      triggers:
        - git_hooks: [pre-commit]
      run: scripts/gen-compile-commands.zsh
    - id: zpm-gen-compile-commands-pre-push
      triggers:
        - git_hooks: [pre-push]
      run: scripts/gen-compile-commands.zsh
