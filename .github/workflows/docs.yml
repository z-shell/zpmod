name: Docs

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Show tool versions
        run: |
          cmake --version
          doxygen --version
          dot -V || true

      - name: Configure (CMake)
        run: cmake -S . -B build-docs -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build docs
        run: |
          set -euxo pipefail
          cmake --build build-docs --target docs -- -v
          echo "==== Docs tree ===="
          ls -lR build-docs/docs || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-docs/docs/html

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
