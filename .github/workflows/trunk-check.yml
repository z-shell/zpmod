name: Trunk Code Quality

# Thin caller for the organization Trunk workflow, so the linters enabled in
# .trunk/trunk.yaml also run on pull requests and main, not only in local git
# hooks. Pull request and push runs report only issues the change introduces.
# There is no scheduled full scan yet: main still has formatter and hadolint
# findings that a full scan would report on every run. A manual run is a
# full scan.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Trunk Code Quality
    permissions:
      contents: read
    uses: z-shell/.github/.github/workflows/trunk.yml@18433229ccbfc9e59332710ee3cc1ba5b920b49c # main
    with:
      arguments: --no-progress
      # clang-tidy and clang-format read compile_commands.json. Trunk's own
      # prepare step does not leave one behind on a clean checkout, so every C
      # file would fail include scanning; generate it before Trunk runs.
      setup-command: sh scripts/gen-compile-commands.sh
