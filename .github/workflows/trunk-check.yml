name: Trunk Code Quality

# Thin caller for the organization Trunk workflow, so the linters enabled in
# .trunk/trunk.yaml also run on pull requests and main, not only in local git
# hooks. Pull request and push runs report only issues the change introduces;
# the weekly and manual runs scan the whole repository.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 5 * * 5"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Trunk Code Quality
    permissions:
      contents: read
    uses: z-shell/.github/.github/workflows/trunk.yml@18433229ccbfc9e59332710ee3cc1ba5b920b49c # main
    with:
      arguments: --no-progress
      # clang-tidy reads compile_commands.json, which Trunk's own prepare step
      # does not leave behind on a clean checkout. Generate it against a
      # configured vendor/zsh (config.h and the generated headers and
      # prototypes, as docker/*.Dockerfile build them); an unconfigured tree
      # makes clang-tidy report Zsh's own macros as zpmod findings.
      setup-command: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends autoconf libncurses-dev
        git submodule update --init vendor/zsh
        (cd vendor/zsh && ./Util/preconfig && ./configure && make -C Src headers proto)
        sh scripts/gen-compile-commands.sh
