---
name: 🚀 Trunk Code Quality

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  trunk-check:
    name: 🔍 Comprehensive Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: ⤵️ Check out code
        uses: actions/checkout@v4

      - name: 🚀 Trunk Check
        uses: trunk-io/trunk-action@v1
        with:
          # Run all enabled linters
          arguments: check --all --no-progress

      - name: 🛡️ Security and Maintenance Check
        uses: trunk-io/trunk-action@v1
        with:
          # Run zpmod-specific maintenance and security checks
          arguments: check --filter=zpmod-maintenance,gitleaks --all --no-progress

      - name: 🏗️ Quality Verification
        uses: trunk-io/trunk-action@v1
        with:
          # Run comprehensive quality checks (replaces custom GitHub Actions logic)
          arguments: check --filter=zpmod-quality --all --no-progress

  format-check:
    name: 📝 Format Check
    runs-on: ubuntu-latest

    steps:
      - name: ⤵️ Check out code
        uses: actions/checkout@v4

      - name: 🎨 Check formatting
        uses: trunk-io/trunk-action@v1
        with:
          arguments: fmt --check --all

  performance:
    name: ⚡ Performance Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: ⤵️ Check out code
        uses: actions/checkout@v4

      - name: ⚡ Fast quality check (sample)
        uses: trunk-io/trunk-action@v1
        with:
          # Use sampling for faster PR feedback
          arguments: check --sample=10 --no-progress

  comprehensive:
    name: 🎯 Full Comprehensive Check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
      - name: ⤵️ Check out code
        uses: actions/checkout@v4

      - name: 🎯 Full maintenance workflow
        run: |
          # Run the full maintenance workflow for main/develop branches
          ./Scripts/maintenance.sh comprehensive

      - name: 📊 Trunk cache stats
        run: |
          # Show cache efficiency stats
          trunk cache stats || echo "Cache stats not available"
