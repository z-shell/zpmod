---
name: 🐧 Build (Linux)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: ☑️ ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          scandir: "./Scripts"
          ignore_paths: "copy_from_zsh_src.zsh"

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    needs: [shellcheck]
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: ⚙️ Setup Zsh and dependencies
        uses: z-shell/.github/actions/setup-zsh@main

      - name: ⚙️ Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: ⚙️ Determine Branch
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # For PR events, use HEAD_REF; for push events, use REF_NAME
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "branch=$HEAD_REF" >> $GITHUB_OUTPUT
          else
            echo "branch=$REF_NAME" >> $GITHUB_OUTPUT
          fi

      - name: 🔨 Build zpmod module
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.branch }}
        run: |
          sh ./Scripts/install.sh --no-git --target=$(pwd) --branch="$BRANCH_NAME"
          ls -la ./Src/zi
          echo "✅ Build completed successfully"

      - name: 📁 Create test files for functionality testing
        run: |
          mkdir -p test_files

          # Create test Zsh scripts to compile
          cat > test_files/test1.zsh << 'EOF'
          #!/usr/bin/env zsh
          # Test script 1 for zpmod compilation
          echo "Test script 1 executing"
          for i in {1..5}; do
            echo "Loop iteration: $i"
          done
          EOF

          cat > test_files/test2.zsh << 'EOF'
          #!/usr/bin/env zsh
          # Test script 2 for zpmod compilation
          function test_function() {
            echo "Test function called with args: $@"
          }
          test_function "hello" "world"
          EOF

          cat > test_files/slow_script.zsh << 'EOF'
          #!/usr/bin/env zsh
          # Simulated slow script for performance testing
          echo "Starting slow operations..."
          sleep 0.1
          echo "Slow operations completed"
          EOF

          chmod +x test_files/*.zsh
          echo "✅ Test files created"

      - name: 🔄 Load zpmod module
        run: |
          module_path+=( "$PWD/Src" )
          if zmodload zi/zpmod; then
            echo "✅ zpmod module loaded successfully"
          else
            echo "❌ Failed to load zpmod module"
            exit 1
          fi
        shell: zsh {0}

      - name: 📊 Test source-study functionality
        run: |
          module_path+=( "$PWD/Src" )
          zmodload zi/zpmod

          # Test basic source-study report
          echo "=== Testing source-study basic report ==="
          if zpmod source-study; then
            echo "✅ Basic source-study report generated"
          else
            echo "❌ Failed to generate basic source-study report"
            exit 1
          fi

          # Test source-study with -l flag (list mode)
          echo "=== Testing source-study list mode ==="
          if zpmod source-study -l; then
            echo "✅ List mode source-study completed"
          else
            echo "❌ Failed to generate list mode report"
            exit 1
          fi
        shell: zsh {0}

      - name: 🗂️ Test path cache functionality
        run: |
          module_path+=( "$PWD/Src" )
          zmodload zi/zpmod

          # Test path cache clearing
          echo "=== Testing path cache management ==="
          if zpmod clear-path-cache; then
            echo "✅ Path cache operations successful"
          else
            echo "❌ Path cache operations failed"
            exit 1
          fi
        shell: zsh {0}

      - name: ⚙️ Test compilation configuration
        run: |
          module_path+=( "$PWD/Src" )
          zmodload zi/zpmod

          echo "=== Testing compilation configuration ==="

          # Display current config
          if zpmod compile-config; then
            echo "✅ Compilation config display successful"
          else
            echo "❌ Failed to display compilation config"
            exit 1
          fi

          # Test enabling/disabling compilation
          if zpmod compile-config enable && zpmod compile-config disable; then
            echo "✅ Compilation enable/disable successful"
          else
            echo "❌ Failed to toggle compilation settings"
            exit 1
          fi

          # Test batch mode configuration
          if zpmod compile-config batch on && zpmod compile-config batch off; then
            echo "✅ Batch mode configuration successful"
          else
            echo "❌ Failed to configure batch mode"
            exit 1
          fi
        shell: zsh {0}

      - name: 📝 Test script compilation and sourcing
        run: |
          module_path+=( "$PWD/Src" )
          zmodload zi/zpmod

          echo "=== Testing automatic script compilation ==="

          # Enable compilation
          zpmod compile-config enable

          # Source test scripts to trigger compilation
          for script in test_files/*.zsh; do
            echo "Testing script: $script"
            if source "$script"; then
              echo "✅ Successfully sourced $script"

              # Check if .zwc file was created
              zwc_file="${script}.zwc"
              if [[ -f "$zwc_file" ]]; then
                echo "✅ Compiled file $zwc_file was created"
              else
                echo "ℹ️  No .zwc file created for $script (may be intentional)"
              fi
            else
              echo "❌ Failed to source $script"
              exit 1
            fi
          done
        shell: zsh {0}

      - name: 📈 Test performance tracking
        run: |
          module_path+=( "$PWD/Src" )
          zmodload zi/zpmod

          echo "=== Testing performance tracking ==="

          # Source scripts to generate performance data
          source test_files/slow_script.zsh
          source test_files/test1.zsh
          source test_files/test2.zsh

          # Generate performance report
          echo "Generating performance report..."
          if zpmod source-study; then
            echo "✅ Performance tracking and reporting successful"
          else
            echo "❌ Performance tracking failed"
            exit 1
          fi
        shell: zsh {0}

      - name: 🧪 Test error handling and edge cases
        run: |
          module_path+=( "$PWD/Src" )
          zmodload zi/zpmod

          echo "=== Testing error handling ==="

          # Test with invalid commands (should fail gracefully)
          if zpmod invalid-command 2>/dev/null; then
            echo "❌ Should have failed with invalid command"
            exit 1
          else
            echo "✅ Invalid command handled correctly"
          fi

          # Test help command
          if zpmod -h >/dev/null; then
            echo "✅ Help command works"
          else
            echo "❌ Help command failed"
            exit 1
          fi
        shell: zsh {0}

      - name: 📋 Final verification and cleanup
        run: |
          echo "=== Final Verification ==="

          # List created files
          echo "Files created during testing:"
          find test_files -type f -name "*.zsh*" | sort

          # Module status
          module_path+=( "$PWD/Src" )
          zmodload zi/zpmod
          zpmod source-study -l

          echo "✅ All zpmod functionality tests completed successfully"
        shell: zsh {0}
