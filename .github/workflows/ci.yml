name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  native-tests:
    name: Native Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.20"

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-native
          max-size: 500M

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            texinfo yodl libncurses5-dev libpcre3-dev libgdbm-dev zsh

      - name: Install deps (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install autoconf automake libtool ncurses pcre gdbm texinfo

      - name: Configure, build, and test
        shell: zsh {0}
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          scripts/cmake.configure.zsh \
            --generator ninja \
            --build-type Release \
            --verbose \
            --ctest \
            --ctest-jobs 2

      - name: Upload native logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-native-${{ matrix.os }}
          path: |
            build-results/**
            build-cmake/Testing/**
          retention-days: 7
          if-no-files-found: ignore

  docker-tests:
    name: Docker Tests (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        env: [minimal, full-dev]
    env:
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test environment
        working-directory: docker
        run: |
          docker compose build test-${{ matrix.env }}

      - name: Run tests in ${{ matrix.env }} environment
        working-directory: docker
        run: |
          docker compose run --rm test-${{ matrix.env }}

      - name: Build validation
        if: matrix.env == 'minimal'
        working-directory: docker
        run: |
          docker compose run --rm build-validation

      - name: Upload build logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.env }}
          path: |
            build-results/**
            build-cmake/Testing/**
          retention-days: 7
          if-no-files-found: ignore

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run smoke tests
        working-directory: docker
        run: |
          docker compose build test-smoke
          docker compose run --rm test-smoke

      - name: Upload smoke logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-smoke
          path: |
            build-results/**
            build-cmake/Testing/**
          retention-days: 7
          if-no-files-found: ignore
