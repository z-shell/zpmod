name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.20"

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-ci

      - name: Install build dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autotools-dev \
            autoconf \
            automake \
            pkg-config \
            libtool \
            texinfo \
            yodl \
            libncurses5-dev \
            libpcre3-dev \
            libgdbm-dev

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install autoconf automake libtool ncurses pcre gdbm yodl texinfo

      - name: Configure and build
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./scripts/cmake.configure.zsh --generator ninja --build-type Release --verbose

      - name: Run tests
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./scripts/cmake.configure.zsh --no-submodule --no-vendor-build --test

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: zpmod-${{ runner.os }}-module
          path: |
            build-cmake/out/lib/zpmod.*
            build-cmake/stage/lib/zsh/site-modules/zpmod.*
            build-cmake/compile_commands.json
            build-cmake/stage/share/zsh/site-functions/_zpmod
          retention-days: 14

  asan-ubsan:
    name: ASan (Linux; sanitized zsh)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.20"

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libncurses-dev \
            texinfo \
            yodl

      - name: Build sanitized zsh (vendor)
        env:
          CFLAGS: "-O1 -g -fno-omit-frame-pointer -fsanitize=address"
          LDFLAGS: "-fsanitize=address"
          PREFIX: "${{ github.workspace }}/.zsh-asan"
        run: |
          set -euxo pipefail
          cd vendor/zsh
          ./Util/preconfig || true
          ./configure --prefix="$PREFIX" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"
          make -j2
          # Install only the binary; skip docs/manpages to avoid yodl dependency
          make install.bin
          "$PREFIX/bin/zsh" --version

      - name: Configure and build zpmod (sanitized)
        env:
          CFLAGS: "-O1 -g -fno-omit-frame-pointer -fsanitize=address"
          LDFLAGS: "-fsanitize=address"
        run: |
          # Build zpmod with sanitizer flags using CMake directly
          # (script doesn't support custom build directory names yet)
          cmake -S . -B build-sanitize \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$LDFLAGS" \
            -DCMAKE_MODULE_LINKER_FLAGS="$LDFLAGS" \
            -DZSH_EXECUTABLE="${{ github.workspace }}/.zsh-asan/bin/zsh"
          cmake --build build-sanitize -j 2
          cmake --build build-sanitize --target stage

      - name: Run tests
        env:
          ASAN_OPTIONS: "detect_leaks=0:strict_string_checks=1:abort_on_error=1"
        run: |
          # Use the built sanitized zsh for testing
          ZSH_EXECUTABLE="${{ github.workspace }}/.zsh-asan/bin/zsh" \
          ctest --test-dir build-cmake --output-on-failure -j 2
