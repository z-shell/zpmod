name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  quick:
    name: quick (essential)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake zsh

      - name: Configure
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-cmake -j 2

      - name: Stage
        run: cmake --build build-cmake --target stage

      - name: Tests (essential)
        run: ctest --test-dir build-cmake -L essential -j 2

      - name: Rerun with debug on failure
        if: failure()
        env:
          ZPMOD_TEST_DEBUG: "1"
        run: ctest --test-dir build-cmake -L essential -j 2

  labels:
    name: label (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: quick
    strategy:
      fail-fast: false
      matrix:
        label: [core, builtin, command, filesystem, file_io, platform]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake zsh

      - name: Configure
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-cmake -j 2

      - name: Stage
        run: cmake --build build-cmake --target stage

      - name: Tests (label)
        run: ctest --test-dir build-cmake -L "${{ matrix.label }}" -j 2

      - name: Rerun with debug on failure
        if: failure()
        env:
          ZPMOD_TEST_DEBUG: "1"
        run: ctest --test-dir build-cmake -L "${{ matrix.label }}" -j 2

      # Build zpmod with sanitizer instrumentation
      - name: Configure and build zpmod (sanitized)
        env:
          # AddressSanitizer flags for zpmod module
          CFLAGS: "-O1 -g -fno-omit-frame-pointer -fsanitize=address"
          LDFLAGS: "-fsanitize=address"
        run: |
          echo "🔧 Building zpmod with memory sanitizers..."
          # Build zpmod with sanitizer flags using CMake directly
          # Note: Using direct CMake instead of script for custom build directory
          cmake -S . -B build-sanitize \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$LDFLAGS" \
            -DCMAKE_MODULE_LINKER_FLAGS="$LDFLAGS" \
            -DZSH_EXECUTABLE="${{ github.workspace }}/.zsh-asan/bin/zsh"

          echo "🏗️  Building zpmod with parallel jobs..."
          cmake --build build-sanitize -j 2
          cmake --build build-sanitize --target stage

      # Execute tests with sanitized zsh and zpmod
      - name: Run sanitized tests
        env:
          # AddressSanitizer configuration for test execution
          ASAN_OPTIONS: "detect_leaks=0:strict_string_checks=1:abort_on_error=1"
        run: |
          echo "🧪 Running tests with sanitized zsh and zpmod..."
          echo "🔍 AddressSanitizer will detect memory errors, buffer overflows, use-after-free, etc."

          # Execute test suite using sanitized zsh
          ZSH_EXECUTABLE="${{ github.workspace }}/.zsh-asan/bin/zsh" \
          ctest \
            --test-dir build-sanitize \
            --output-on-failure \
            -j 2

          echo "✅ All sanitizer tests passed - no memory errors detected!"
