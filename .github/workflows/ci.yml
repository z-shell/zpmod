name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            vendor/zsh
          key: |
            ${{ runner.os }}-ccache-${{hashFiles('CMakeLists.txt', 'src/**', 'tests/**', 'cmake/**', 'vendor/zsh/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ccache zsh
          echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          cmake --version
          ccache --version || true
          zsh --version

      - name: Configure (Release)
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 3
        run: |
          cmake -S . -B build-cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 3
        run: cmake --build build-cmake -- -v

      - name: Stage
        run: |
          set -euxo pipefail
          cmake --build build-cmake --target stage -- -v || true
          # Fallback to direct install if stage target did not run cleanly
          if [ ! -d build-cmake/stage/lib ] || [ ! -e build-cmake/stage/lib/zsh/site-modules/zpmod.so ]; then
            cmake --install build-cmake --prefix build-cmake/stage || true
          fi
          echo "==== Staged tree ===="
          ls -lR build-cmake/stage || true
          echo "==== Built libs ===="
          ls -l build-cmake/out/lib || true

      - name: Run tests
        run: ctest --test-dir build-cmake --output-on-failure -j 2

      - name: Print CTest log (on failure)
        if: failure()
        run: |
          echo "==== CTest LastTest.log (tail) ===="
          if test -f build-cmake/Testing/Temporary/LastTest.log; then
            tail -n +1 build-cmake/Testing/Temporary/LastTest.log
          fi

      - name: Upload CTest log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ runner.os }}
          path: |
            build-cmake/Testing/Temporary/LastTest.log
            build-cmake/Testing/**/Test.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: zpmod-${{ runner.os }}-module
          path: |
            build-cmake/out/lib/zpmod.*
            build-cmake/stage/lib/zsh/site-modules/zpmod.*
            build-cmake/compile_commands.json
            build-cmake/stage/share/zsh/site-functions/_zpmod
          retention-days: 14

  asan-ubsan:
    name: ASan (Linux; sanitized zsh)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config libncurses-dev
      - name: Build sanitized zsh (vendor)
        env:
          CFLAGS: "-O1 -g -fno-omit-frame-pointer -fsanitize=address"
          LDFLAGS: "-fsanitize=address"
          PREFIX: "${{ github.workspace }}/.zsh-asan"
        run: |
          set -euxo pipefail
          cd vendor/zsh
          ./Util/preconfig || true
          ./configure --prefix="$PREFIX" CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"
          make -j2
          # Install only the binary; skip docs/manpages to avoid yodl dependency
          make install.bin
          "$PREFIX/bin/zsh" --version
      - name: Configure zpmod (sanitized)
        env:
          CFLAGS: "-O1 -g -fno-omit-frame-pointer -fsanitize=address"
          LDFLAGS: "-fsanitize=address"
        run: |
          cmake -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="$CFLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="$LDFLAGS" \
            -DCMAKE_MODULE_LINKER_FLAGS="$LDFLAGS" \
            -DZSH_EXECUTABLE="${{ github.workspace }}/.zsh-asan/bin/zsh"
      - name: Build + Stage
        run: |
          cmake --build build-sanitize -j 2
          cmake --build build-sanitize --target stage
          echo "==== Staged module dir ===="
          ls -l build-sanitize/stage/lib/zsh/site-modules || true
          echo "==== Staged completion ===="
          ls -l build-sanitize/stage/share/zsh/site-functions || true
      - name: Sanity load module with sanitized zsh
        run: |
          set -euxo pipefail
          MODDIR="${{ github.workspace }}/build-sanitize/stage/lib/zsh/site-modules"
          ZSH_BIN="${{ github.workspace }}/.zsh-asan/bin/zsh"
          test -x "$ZSH_BIN"
          test -e "$MODDIR/zpmod.so"
          "$ZSH_BIN" -fc 'module_path=("'"$MODDIR"'" $module_path); zmodload -i zpmod; whence -w zpmod'
      - name: Run tests
        env:
          ASAN_OPTIONS: "detect_leaks=0:strict_string_checks=1:abort_on_error=1"
        run: ctest --test-dir build-sanitize --output-on-failure -j 2
      - name: Print CTest log (on failure)
        if: failure()
        run: |
          echo "==== CTest LastTest.log (tail) ===="
          if test -f build-sanitize/Testing/Temporary/LastTest.log; then
            tail -n +1 build-sanitize/Testing/Temporary/LastTest.log
          fi
      - name: Upload CTest log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-asan
          path: build-sanitize/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  clang-tidy:
    name: Clang-Tidy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install clang-tidy (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy zsh
      - name: Install clang-tidy (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm zsh
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Show versions
        run: |
          cmake --version
          clang-tidy --version || true
      - name: Configure (generate compile_commands)
        run: cmake -S . -B build-tidy -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy on src
        run: |
          set -e
          files=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${GITHUB_BASE_REF}" ]]; then
            git fetch origin "${GITHUB_BASE_REF}:${GITHUB_BASE_REF}" || true
            files=$(git diff --name-only --diff-filter=ACMRT \
              "origin/${GITHUB_BASE_REF}...HEAD" | \
              grep -E '\\.(c|h)$' || true)
          fi
          if [[ -z "$files" ]]; then
            files=$(git ls-files 'src/**/*.c' 'src/**/*.h' 'src/*.c' 'src/*.h' || true)
          fi
          if [[ -z "$files" ]]; then
            echo "No source files found for clang-tidy"
            exit 0
          fi
          echo "$files" | xargs -n 1 -P 2 clang-tidy -p build-tidy --quiet || true
