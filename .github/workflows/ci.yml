name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            vendor/zsh
          key: |
            ${{ runner.os }}-ccache-${{hashFiles('CMakeLists.txt', 'src/**', 'tests/**', 'cmake/**', 'vendor/zsh/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ccache zsh
          echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          cmake --version
          ccache --version || true
          zsh --version

      - name: Configure (Release)
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 3
        run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 3
        run: cmake --build build-cmake

      - name: Stage
        run: cmake --build build-cmake --target stage

      - name: Run tests
        run: ctest --test-dir build-cmake --output-on-failure -j 2

      - name: Print CTest log (on failure)
        if: failure()
        run: |
          echo "==== CTest LastTest.log (tail) ===="
          if test -f build-cmake/Testing/Temporary/LastTest.log; then
            tail -n +1 build-cmake/Testing/Temporary/LastTest.log
          fi

      - name: Upload CTest log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ runner.os }}
          path: |
            build-cmake/Testing/Temporary/LastTest.log
            build-cmake/Testing/**/Test.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: zpmod-${{ runner.os }}-module
          path: |
            build-cmake/out/lib/zpmod.*
            build-cmake/stage/lib/zsh/site-modules/zpmod.*
            build-cmake/compile_commands.json
            build-cmake/stage/share/zsh/site-functions/_zpmod
          retention-days: 14

  asan-ubsan:
    name: ASan/UBSan (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Configure (ASan/UBSan)
        env:
          CFLAGS: "-O1 -fno-omit-frame-pointer -fsanitize=address,undefined"
          LDFLAGS: "-fsanitize=address,undefined"
          ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1:abort_on_error=1:log_path=asan
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake -S . -B build-sanitize \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_FLAGS="${CFLAGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="${LDFLAGS}" \
            -DCMAKE_SHARED_LINKER_FLAGS="${LDFLAGS}"
      - name: Build (ASan/UBSan)
        run: cmake --build build-sanitize -j 2
      - name: Stage (ASan/UBSan)
        run: cmake --build build-sanitize --target stage
      - name: Run tests (ASan/UBSan)
        run: |
          set -euo pipefail
          export ASAN_OPTIONS=detect_leaks=0:strict_string_checks=1:abort_on_error=1:log_path=asan
          export UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1
          LIBASAN="$(gcc -print-file-name=libasan.so || true)"
          if [ -n "$LIBASAN" ] && [ -f "$LIBASAN" ]; then
            export LD_PRELOAD="$LIBASAN"
          fi
          ctest --test-dir build-sanitize --output-on-failure -j 2
      - name: Print CTest log (ASan/UBSan)
        if: failure()
        run: |
          echo "==== ASan/UBSan CTest LastTest.log (tail) ===="
          if test -f build-sanitize/Testing/Temporary/LastTest.log; then
            tail -n +1 build-sanitize/Testing/Temporary/LastTest.log
          fi
      - name: Upload CTest log (ASan/UBSan)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-asan
          path: |
            build-sanitize/Testing/Temporary/LastTest.log
            build-sanitize/asan.*.log*
          if-no-files-found: ignore
          retention-days: 14

  clang-tidy:
    name: Clang-Tidy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install clang-tidy (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy zsh
      - name: Install clang-tidy (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install llvm zsh
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Show versions
        run: |
          cmake --version
          clang-tidy --version || true
      - name: Configure (generate compile_commands)
        run: cmake -S . -B build-tidy -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Run clang-tidy on src
        run: |
          set -e
          files=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && -n "${GITHUB_BASE_REF}" ]]; then
            git fetch origin "${GITHUB_BASE_REF}:${GITHUB_BASE_REF}" || true
            files=$(git diff --name-only --diff-filter=ACMRT \
              "origin/${GITHUB_BASE_REF}...HEAD" | \
              grep -E '\\.(c|h)$' || true)
          fi
          if [[ -z "$files" ]]; then
            files=$(git ls-files 'src/**/*.c' 'src/**/*.h' 'src/*.c' 'src/*.h' || true)
          fi
          if [[ -z "$files" ]]; then
            echo "No source files found for clang-tidy"
            exit 0
          fi
          echo "$files" | xargs -n 1 -P 2 clang-tidy -p build-tidy --quiet || true
