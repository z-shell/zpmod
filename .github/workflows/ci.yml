name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  native-tests:
    name: Native Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: "3.20"

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ matrix.os }}-native
          max-size: 500M

      - name: Install deps (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            texinfo yodl libncurses5-dev libpcre3-dev libgdbm-dev zsh python3

      - name: Install deps (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install autoconf automake libtool ncurses pcre gdbm texinfo

      - name: Configure, build, and test
        shell: zsh {0}
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          scripts/cmake.configure.zsh \
            --generator ninja \
            --build-type Release \
            --verbose \
            --ctest \
            --ctest-jobs 2

      - name: Upload native logs (if any)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-native-${{ matrix.os }}
          path: |
            build-results/**
            build-cmake/Testing/**
          retention-days: 7
          if-no-files-found: ignore

  docker-tests:
    name: Docker Tests (${{ matrix.env }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        env: [minimal, full-dev]
    env:
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build test environment
        working-directory: docker
        run: |
          docker compose build test-${{ matrix.env }}

      - name: Run tests in ${{ matrix.env }} environment
        working-directory: docker
        run: |
          docker compose run --rm test-${{ matrix.env }}

      - name: Build validation
        if: matrix.env == 'minimal'
        working-directory: docker
        run: |
          docker compose run --rm build-validation

      - name: Upload build logs (if any)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ matrix.env }}
          path: |
            build-results/**
            build-cmake/Testing/**
          retention-days: 7
          if-no-files-found: ignore

  zd-digests:
    name: Controlled Digest Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compare qualified zd digests in workflow and README
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          zsh scripts/check_zd_digests.zsh

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_DOCKER_CLI_BUILD: 1
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and run smoke tests
        working-directory: docker
        run: |
          docker compose build test-smoke
          docker compose run --rm test-smoke

      - name: Upload smoke logs (if any)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-smoke
          path: |
            build-results/**
            build-cmake/Testing/**
          retention-days: 7
          if-no-files-found: ignore
