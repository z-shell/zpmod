name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  docker-tests:
    name: Docker Tests (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [minimal, full-dev]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test environment
        run: |
          cd docker && docker compose build test-${{ matrix.env }}

      - name: Run tests in ${{ matrix.env }} environment
        run: |
          cd docker && docker compose run --rm test-${{ matrix.env }}

      - name: Build validation
        if: matrix.env == 'minimal'
        run: |
          cd docker && docker compose run --rm build-validation

      - name: Upload build logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.env }}
          path: |
            build-results/**
            build-cmake/Testing/**
          if-no-files-found: ignore

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run smoke tests
        run: |
          cd docker
          docker compose build test-smoke
          docker compose run --rm test-smoke

      - name: Upload smoke logs (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-smoke
          path: |
            build-results/**
            build-cmake/Testing/**
          if-no-files-found: ignore
