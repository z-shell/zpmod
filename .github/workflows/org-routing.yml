---
name: Org Routing

# ADR-0031: verify generated routing and approved organization skills.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# The reusable workflow owns concurrency; a duplicate caller group can deadlock.
jobs:
  org-routing:
    name: Org Routing
    permissions:
      contents: read
    uses: z-shell/.github/.github/workflows/org-routing.yml@cf854972f5d84a4a71229a4208ac9d3570b6ee48 # main
