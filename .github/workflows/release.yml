name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build + Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
          key: |
            ${{ runner.os }}-ccache-release-${{ hashFiles('CMakeLists.txt', 'src/**', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build zsh ccache

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install ninja ccache || true
          echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"

      - name: Configure (Ninja, Release)
        run: |
          set -euo pipefail
          rm -rf build-cmake
          cmake -S . -B build-cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build module
        run: |
          set -euo pipefail
          cmake --build build-cmake -j 2

      - name: Stage install
        run: |
          set -euo pipefail
          cmake --build build-cmake --target stage

      - name: Locate and stage module
        run: |
          set -euo pipefail
          MODLIBDIR=$(cmake -LA -N build-cmake 2>/dev/null | grep '^CMAKE_INSTALL_LIBDIR:' | cut -d= -f2 || true)
          MODLIBDIR=${MODLIBDIR:-lib}
          MODDIR="build-cmake/stage/${MODLIBDIR}/zsh/site-modules"
          if [ ! -d "$MODDIR" ]; then MODDIR="build-cmake/stage/lib/zsh/site-modules"; fi
          mkdir -p "$MODDIR"
          CANDIDATE=""
          if [ -f build-cmake/out/lib/zpmod.so ]; then CANDIDATE="build-cmake/out/lib/zpmod.so"; fi
          if [ -z "$CANDIDATE" ]; then
            CANDIDATE=$(find build-cmake -type f -name 'zpmod.*' | grep -E '/(lib)?zpmod\.(so|dylib|bundle)$' | head -n1 || true)
          fi
          if [ -z "$CANDIDATE" ] && [ -f build-cmake/CMakeFiles/zpmod.dir/link.txt ]; then
            OUT_PATH=$(sed -n 's/.* -o \([^ ]*\).*/\1/p' build-cmake/CMakeFiles/zpmod.dir/link.txt | head -n1 || true)
            if [ -n "${OUT_PATH:-}" ] && [ "${OUT_PATH#/*}" = "$OUT_PATH" ]; then OUT_PATH="build-cmake/${OUT_PATH}"; fi
            if [ -n "${OUT_PATH:-}" ] && [ -f "$OUT_PATH" ]; then CANDIDATE="$OUT_PATH"; fi
          fi
          if [ -n "$CANDIDATE" ] && [ -f "$CANDIDATE" ]; then
            cp -f "$CANDIDATE" "$MODDIR/zpmod.so"
          fi
          ls -la "$MODDIR" || true

      - name: Smoke test (zmodload)
        run: |
          set -euo pipefail
          MODLIBDIR=$(cmake -LA -N build-cmake 2>/dev/null | grep '^CMAKE_INSTALL_LIBDIR:' | cut -d= -f2 || true)
          MODLIBDIR=${MODLIBDIR:-lib}
          MODDIR="build-cmake/stage/${MODLIBDIR}/zsh/site-modules"
          [ -d "$MODDIR" ] || MODDIR="build-cmake/stage/lib/zsh/site-modules"
          if ! command -v zsh >/dev/null 2>&1; then
            echo "zsh not found" >&2
            exit 1
          fi
          zsh -fc "module_path=(\"$MODDIR\" $module_path); print -r -- module_path=$module_path; zmodload -i zpmod && print -r -- 'zpmod smoke OK'"

      - name: Package (CPack TGZ)
        run: |
          set -euo pipefail
          (cd build-cmake && cpack -G TGZ)
          ls -la build-cmake/*.tar.gz build-cmake/*.tgz || true

      - name: Compute checksums
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(build-cmake/*.tar.gz build-cmake/*.tgz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No packages found" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            if [ "${RUNNER_OS:-}" = "macOS" ]; then
              shasum -a 256 "$f" > "${f}.sha256"
            else
              sha256sum "$f" > "${f}.sha256"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zpmod-${{ runner.os }}-${{ github.ref_name || github.run_number }}
          path: |
            build-cmake/*.tar.gz
            build-cmake/*.tgz
            build-cmake/*.sha256
          retention-days: 14

      - name: Publish GitHub Release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          allowUpdates: true
          draft: false
          generateReleaseNotes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          artifacts: |
            build-cmake/*.tar.gz
            build-cmake/*.tgz
            build-cmake/*.sha256
