# Release workflow
# - Trigger: tag pushes matching v*
# - Build matrix: Ubuntu + macOS
# - Outputs: staged module, built library, CPack packages, SHA256SUMS
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package and upload artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
          key: |
            ${{ runner.os }}-ccache-release-${{hashFiles('CMakeLists.txt', 'src/**', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ccache
          echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ccache

      - name: Show tool versions
        run: |
          cmake --version
          zsh --version
          ccache --version || true

      - name: Configure (Release)
        run: |
          cmake -S . -B build-cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-cmake -- -v

      - name: Stage
        run: |
          set -euxo pipefail
          cmake --build build-cmake --target stage -- -v || true
          # Fallback to direct install if stage target did not run cleanly
          if [ ! -d build-cmake/stage/lib ] || [ ! -e build-cmake/stage/lib/zsh/site-modules/zpmod.so ]; then
            cmake --install build-cmake --prefix build-cmake/stage || true
          fi
          echo "==== Staged tree ===="
          ls -lR build-cmake/stage || true
          echo "==== Built libs ===="
          ls -l build-cmake/out/lib || true

      - name: Smoke load module
        run: |
          set -euxo pipefail
          MODDIR="$PWD/build-cmake/stage/lib/zsh/site-modules"
          echo "MODDIR=$MODDIR"
          # Show what's staged and ensure module exists
          if ! ls -la "$MODDIR"; then
            echo "Module directory missing. Searching for built module..."
            find build-cmake -maxdepth 5 -type f -name 'zpmod.*' -print || true
            exit 1
          fi
          if [ ! -f "$MODDIR/zpmod.so" ] && [ ! -f "$MODDIR/zpmod.dylib" ]; then
            echo "zpmod.* not found in $MODDIR"
            find build-cmake -maxdepth 5 -type f -name 'zpmod.*' -print || true
            exit 1
          fi
          export MODDIR
          # Load module from the staged directory explicitly
          zsh -fc 'print -r -- "zsh: $ZSH_VERSION"; \
                   print -r -- "Before module_path:"; print -lr -- $module_path; \
                   zmodload -d "${MODDIR}"; \
                   print -r -- "After module_path:"; print -lr -- $module_path; \
                   zmodload -i zpmod; \
                   zmodload -L zpmod || true; \
                   whence -w zpmod || true'

      - name: Package with CPack
        run: |
          cmake --build build-cmake --target package || true

      - name: Generate SHA256 checksums
        run: |
          set -euxo pipefail
          cd build-cmake
          : > SHA256SUMS
          list="$(ls out/lib/zpmod.* 2>/dev/null || true) $(ls *.tar.* *.tgz 2>/dev/null || true)"
          for f in $list; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> SHA256SUMS
            else
              shasum -a 256 "$f" >> SHA256SUMS
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zpmod-${{ runner.os }}-${{ github.ref_name }}-artifacts
          path: |
            build-cmake/out/lib/zpmod.*
            build-cmake/stage/**
            build-cmake/*.tar.*
            build-cmake/*.tgz
            build-cmake/SHA256SUMS
          retention-days: 14

  github-release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
