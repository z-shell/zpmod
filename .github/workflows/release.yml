name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (optional - uses current ref if empty)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            autotools-dev \
            autoconf \
            automake \
            pkg-config \
            libtool \
            texinfo \
            yodl \
            libncurses5-dev \
            libpcre3-dev \
            libgdbm-dev \
            zsh

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install autoconf automake libtool ncurses pcre2 gdbm texinfo ninja

      - name: Configure project
        run: |
          ./scripts/cmake.configure.zsh --generator ninja --build-type Release --verbose

      - name: Build and package
        run: |
          # Select OS-specific CPack generators
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            GEN="TGZ;TXZ;DEB;RPM"
          else
            GEN="TGZ;TXZ"
          fi
          ./scripts/cmake.configure.zsh --no-submodule --no-vendor-build --package --test --cpack-generators "$GEN"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.platform }}
          path: |
            build-cmake/*.tar.*
            build-cmake/*.zip
            build-cmake/*.dmg
            build-cmake/*.deb
            build-cmake/*.rpm
          retention-days: 30
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts/ \( -name "*.tar.*" -o -name "*.zip" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" \) -type f -print0 \
            | xargs -0 -I {} cp -v {} release-assets/ 2>/dev/null || true
          cd release-assets
          if compgen -G "*.*" >/dev/null; then
            sha256sum * > SHA256SUMS
            sha256sum --check SHA256SUMS
          fi
          ls -la

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Cross-platform zsh module release built from commit \`$RELEASE_COMMIT\`.

          ### Prebuilt Packages

          - **Linux**: \`.tar.gz\`, \`.tar.xz\`, \`.deb\`, \`.rpm\`
          - **macOS**: \`.tar.gz\`, \`.tar.xz\`
          - Checksums: \`SHA256SUMS\`

          ### Quick Install

          Extract the prebuilt archive for your platform to your Zsh site-modules directory or load directly in \`.zshrc\`:

          \`\`\`zsh
          module_path=( "/path/to/extracted/lib/zsh/site-modules" \$module_path )
          zmodload -i zpmod
          \`\`\`
          EOF

          EXTRA_FLAGS=()
          if [[ "$RELEASE_TAG" == *"-"* ]]; then
            EXTRA_FLAGS+=( --prerelease )
          fi

          gh release create "$RELEASE_TAG" release-assets/* \
            -R "${{ github.repository }}" \
            --target "$RELEASE_COMMIT" \
            --title "zpmod $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes \
            "${EXTRA_FLAGS[@]}"
