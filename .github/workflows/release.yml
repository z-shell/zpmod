# Release workflow
# - Trigger: tag pushes matching v*
# - Build matrix: Ubuntu + macOS
# - Outputs: staged module, built library, CPack packages, SHA256SUMS
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package and upload artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
          key: |
            ${{ runner.os }}-ccache-release-${{hashFiles('CMakeLists.txt', 'src/**', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ccache
          echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh ccache

      - name: Show tool versions
        run: |
          cmake --version
          zsh --version
          ccache --version || true
          echo "CMAKE_GENERATOR=$(cmake -S . -B build-cmake -LA 2>/dev/null >/dev/null || true; \
            awk -F= '/^CMAKE_GENERATOR:/{print $2}' build-cmake/CMakeCache.txt 2>/dev/null || true)"

      - name: Configure (Release)
        run: |
          cmake -S . -B build-cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build-cmake --target zpmod --config Release -- -v

      - name: Stage
        run: |
          set -euxo pipefail
          cmake --build build-cmake --target stage --config Release -- -v || true
          # Fallback to direct install if stage target did not run cleanly
          if [ ! -d build-cmake/stage/lib ] || [ ! -e build-cmake/stage/lib/zsh/site-modules/zpmod.so ]; then
            cmake --install build-cmake --prefix build-cmake/stage --config Release || true
          fi
          # If the module still isn't in the staged directory, copy the built artifact as a final fallback
          STAGE_MODDIR="build-cmake/stage/lib/zsh/site-modules"
          mkdir -p "$STAGE_MODDIR"
          if [ ! -e "$STAGE_MODDIR/zpmod.so" ] && [ ! -e "$STAGE_MODDIR/zpmod.dylib" ]; then
            FOUND_MOD="$(
              find build-cmake -maxdepth 8 -type f -print 2>/dev/null | \
                grep -E \
                  '/(lib)?zpmod\.(so|dylib|bundle)$|/(lib)?zpmod$' | head -n 1 || true
            )"
            if [ -n "$FOUND_MOD" ] && [ -f "$FOUND_MOD" ]; then
              # Normalize name to zpmod.so in stage to match zmodload expectations
              STAGE_TARGET="$STAGE_MODDIR/zpmod.so"
              cp -f "$FOUND_MOD" "$STAGE_TARGET"
              echo "Copied module from $FOUND_MOD to $STAGE_TARGET" || true
              # Print file type for diagnostics
              (command -v file >/dev/null 2>&1 && file "$STAGE_TARGET") || true
            else
              # Derive output from CMake link.txt if available (supports multi-config layouts)
              LINK_TXT="$(
                [ -f build-cmake/CMakeFiles/zpmod.dir/link.txt ] && \
                  echo build-cmake/CMakeFiles/zpmod.dir/link.txt || \
                find build-cmake/CMakeFiles -type f \
                  -path '*/zpmod.dir/*/link.txt' -print 2>/dev/null | \
                  head -n 1 || true
              )"
              if [ -n "$LINK_TXT" ] && [ -f "$LINK_TXT" ]; then
                OUT_PATH="$(awk '{for(i=1;i<=NF;i++){if($i=="-o"){print $(i+1); exit}}}' "$LINK_TXT" | sed 's/\"//g')"
                if [ -n "$OUT_PATH" ] && [ -f "$OUT_PATH" ]; then
                  STAGE_TARGET="$STAGE_MODDIR/zpmod.so"
                  cp -f "$OUT_PATH" "$STAGE_TARGET"
                  echo "Copied module from $OUT_PATH to $STAGE_TARGET (via link.txt)" || true
                  (command -v file >/dev/null 2>&1 && file "$STAGE_TARGET") || true
                fi
              fi
            fi
          fi
          echo "==== Staged tree ===="
          ls -lR build-cmake/stage || true
          echo "==== Built libs ===="
          ls -l build-cmake/out/lib || true

      - name: Smoke load module
        run: |
          set -euxo pipefail
          MODDIR="$PWD/build-cmake/stage/lib/zsh/site-modules"
          echo "Preferred MODDIR=$MODDIR"
          # Ensure staged dir exists and has a module; if not, search elsewhere and backfill
          if [ ! -d "$MODDIR" ] || { [ ! -f "$MODDIR/zpmod.so" ] && [ ! -f "$MODDIR/zpmod.dylib" ]; }; then
            echo "Staged module missing; searching build tree for a candidate..."
            FOUND_MOD="$(
              find build-cmake -maxdepth 8 -type f -print 2>/dev/null | \
                grep -E '/(lib)?zpmod\.(so|dylib|bundle)$|/(lib)?zpmod$' | head -n 1 || true
            )"
            if [ -n "$FOUND_MOD" ]; then
              echo "Found candidate module: $FOUND_MOD"
              mkdir -p "$MODDIR"
              cp -f "$FOUND_MOD" "$MODDIR/zpmod.so" || true
              echo "Backfilled staged dir with $FOUND_MOD as zpmod.so"
            else
              # Try deriving from CMake link.txt
              LINK_TXT="$(
                [ -f build-cmake/CMakeFiles/zpmod.dir/link.txt ] && \
                  echo build-cmake/CMakeFiles/zpmod.dir/link.txt || \
                find build-cmake/CMakeFiles -type f \
                  -path '*/zpmod.dir/*/link.txt' -print 2>/dev/null | \
                  head -n 1 || true
              )"
              if [ -n "$LINK_TXT" ] && [ -f "$LINK_TXT" ]; then
                OUT_PATH="$(awk '{for(i=1;i<=NF;i++){if($i=="-o"){print $(i+1); exit}}}' "$LINK_TXT" | sed 's/\"//g')"
                if [ -n "$OUT_PATH" ] && [ -f "$OUT_PATH" ]; then
                  mkdir -p "$MODDIR"
                  cp -f "$OUT_PATH" "$MODDIR/zpmod.so" || true
                  echo "Backfilled staged dir with $OUT_PATH (via link.txt) as zpmod.so"
                fi
              fi
            else
              echo "No module found in build tree. Diagnostics:"
              find build-cmake -maxdepth 8 -type f -print | grep -E 'zpmod' || true
              exit 1
            fi
          fi
          # Show what's staged now
          ls -la "$MODDIR" || true
          export MODDIR
          # Load module from the available directory explicitly
          zsh -fc 'print -r -- "zsh: $ZSH_VERSION"; \
                   print -r -- "Before module_path:"; print -lr -- $module_path; \
                   zmodload -d "${MODDIR}"; \
                   print -r -- "After module_path:"; print -lr -- $module_path; \
                   zmodload -i zpmod; \
                   zmodload -L zpmod || true; \
                   whence -w zpmod || true'

      - name: Package with CPack
        run: |
          cmake --build build-cmake --target package --config Release || true

      - name: Generate SHA256 checksums
        run: |
          set -euxo pipefail
          cd build-cmake
          : > SHA256SUMS
          list="$(ls out/lib/zpmod.* 2>/dev/null || true) $(ls *.tar.* *.tgz 2>/dev/null || true)"
          for f in $list; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> SHA256SUMS
            else
              shasum -a 256 "$f" >> SHA256SUMS
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zpmod-${{ runner.os }}-${{ github.ref_name }}-artifacts
          path: |
            build-cmake/out/lib/zpmod.*
            build-cmake/stage/**
            build-cmake/*.tar.*
            build-cmake/*.tgz
            build-cmake/SHA256SUMS
          retention-days: 14

  github-release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
