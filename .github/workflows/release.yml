name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (optional - uses current ref if empty)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.20"

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-release
          max-size: 500M

      - name: Install build dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autotools-dev \
            autoconf \
            automake \
            pkg-config \
            libtool \
            texinfo \
            yodl \
            libncurses5-dev \
            libpcre3-dev \
            libgdbm-dev \
            zsh

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install autoconf automake libtool ncurses pcre gdbm texinfo

      - name: Configure project
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./scripts/cmake.configure.zsh --generator ninja --build-type Release --verbose

      - name: Build and package
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          # Select OS-specific CPack generators
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            GEN="TGZ;TXZ;DEB;RPM"
          else
            GEN="TGZ;TXZ"
          fi
          ./scripts/cmake.configure.zsh --no-submodule --no-vendor-build --package --test --cpack-generators "$GEN"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: |
            build-cmake/*.tar.*
            build-cmake/*.zip
            build-cmake/*.dmg
            build-cmake/*.deb
            build-cmake/*.rpm
          retention-days: 30
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts/ \( -name "*.tar.*" -o -name "*.zip" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" \) -type f -print0 \
            | xargs -0 -I {} cp -v {} release-assets/ 2>/dev/null || true
          cd release-assets
          if compgen -G "*.*" >/dev/null; then
            sha256sum * > SHA256SUMS
            sha256sum --check SHA256SUMS
          fi
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          body: |
            ## zpmod ${{ github.ref_name }}

            Cross-platform zsh module release built from commit ${{ github.sha }}.

            ### Prebuilt Packages

            - **Linux**: `.tar.gz`, `.tar.xz`, `.deb`, `.rpm`
            - **macOS**: `.tar.gz`, `.tar.xz`
            - Checksums: `SHA256SUMS`

            ### Quick Install

            Extract the prebuilt archive for your platform to your Zsh site-modules directory or load directly in `.zshrc`:

            ```zsh
            module_path=( "/path/to/extracted/lib/zsh/site-modules" $module_path )
            zmodload -i zpmod
            ```
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
