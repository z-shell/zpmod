name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (optional - uses current ref if empty)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.20"
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-release
          max-size: 500M
      - name: Install build dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autotools-dev \
            autoconf \
            automake \
            pkg-config \
            libtool \
            texinfo \
            yodl \
            libncurses5-dev \
            libpcre3-dev \
            libgdbm-dev \
            zsh
      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install autoconf automake libtool ncurses pcre gdbm texinfo
      - name: Configure project
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./scripts/cmake.configure.zsh --generator ninja --build-type Release --verbose
      - name: Build and package
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./scripts/cmake.configure.zsh --no-submodule --no-vendor-build --package --test
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: |
            build-cmake/**/*.tar.*
            build-cmake/**/*.zip
            build-cmake/**/*.dmg
          if-no-files-found: ignore

  stage-tree:
    name: Stage tree (container)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build staged tree (container)
        run: |
          set -euo pipefail
          export USER_ID="$(id -u)"
          export GROUP_ID="$(id -g)"
          mkdir -p build-results/release
          docker compose -f docker/docker-compose.yml run --rm build-release-clean
      - name: Upload staged tree
        uses: actions/upload-artifact@v4
        with:
          name: staged-tree
          path: build-results/release
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build, stage-tree]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts/ \( -name "*.tar.*" -o -name "*.zip" -o -name "*.dmg" -o -name "SHA256SUMS.txt" \) -type f -print0 \
            | xargs -0 -I {} cp {} release-assets/ 2>/dev/null || true
          cd release-assets
          if ls *.tar.* *.zip *.dmg >/dev/null 2>&1; then
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum *.tar.* *.zip *.dmg 2>/dev/null > SHA256SUMS-combined.txt
            else
              shasum -a 256 *.tar.* *.zip *.dmg > SHA256SUMS-combined.txt
            fi
          else
            touch SHA256SUMS-combined.txt
          fi
          ls -la
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          body: |
            ## zpmod ${{ github.ref_name }}

            Cross-platform zsh module release built from commit ${{ github.sha }}.

            ### Downloads

            - Ubuntu/macOS: Download the appropriate archive
            - Verify with SHA256SUMS-combined.txt

            ### Installation

            1. Download package for your platform
            2. Extract and follow included README
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
