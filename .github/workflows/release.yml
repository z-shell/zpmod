name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.20"

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-release

      - name: Install build dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autotools-dev \
            autoconf \
            automake \
            pkg-config \
            libtool \
            texinfo \
            yodl \
            libncurses5-dev \
            libpcre3-dev \
            libgdbm-dev

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install autoconf automake libtool ncurses pcre gdbm texinfo

      - name: Configure project
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./scripts/cmake.configure.zsh --generator ninja --build-type Release --verbose

      - name: Build and package
        run: |
          export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
          ./scripts/cmake.configure.zsh --no-submodule --no-vendor-build --package --test

      - name: Generate checksums
        run: |
          cd build-cmake

          # Generate checksums for all package files
          for file in *.tar.* *.zip *.dmg; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> SHA256SUMS.txt 2>/dev/null || shasum -a 256 "$file" >> SHA256SUMS.txt
              echo "Generated checksum for: $file"
            fi
          done 2>/dev/null || true

          if [ -f SHA256SUMS.txt ]; then
            echo "Package checksums:"
            cat SHA256SUMS.txt
          else
            echo "Warning: No package files found for checksums"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zpmod-${{ matrix.platform }}
          path: |
            build-cmake/*.tar.*
            build-cmake/*.zip
            build-cmake/*.dmg
            build-cmake/SHA256SUMS.txt
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Collect all package files and checksums
          find artifacts/ -name "*.tar.*" -o -name "*.zip" -o -name "*.dmg" -o -name "SHA256SUMS.txt" | \
          while read file; do
            if [ -f "$file" ]; then
              cp "$file" release-assets/
            fi
          done

          # Generate combined checksums file
          cd release-assets
          if ls *.tar.* *.zip *.dmg >/dev/null 2>&1; then
            sha256sum *.tar.* *.zip *.dmg 2>/dev/null > SHA256SUMS-combined.txt || \
            shasum -a 256 *.tar.* *.zip *.dmg > SHA256SUMS-combined.txt
            echo "Combined checksums:"
            cat SHA256SUMS-combined.txt
          fi

          # List all assets
          echo "Release assets:"
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
